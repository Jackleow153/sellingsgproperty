[build]
  publish = "."
  # Skip the deploy (saves Netlify credits) when a push changes only internal files that are never served.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)CLAUDE.md' ':(exclude)README.md' ':(exclude)NEW_BLOG_TEMPLATE.md' ':(exclude)scripts' ':(exclude)data' ':(exclude).github' ':(exclude)package.json' ':(exclude)package-lock.json' ':(exclude)input.css' ':(exclude)tailwind.config.cjs' ':(exclude)news/copy.json'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Versioned static assets (CSS is referenced with ?v=<hash>): cache for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Optional: simple redirects if you ever add /insights etc as real routes
# [[redirects]]
#   from = "/insights"
#   to = "/index.html"
#   status = 200

[[redirects]]
  from = "/project/valley-point-redevelopment"
  to = "/project/river-opus/"
  status = 301

