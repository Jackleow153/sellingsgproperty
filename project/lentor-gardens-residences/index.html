<script>
  // FAQ accordion
  document.querySelectorAll('.faq-q').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = btn.parentElement;
      const ans = item.querySelector('.faq-a');
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item.open').forEach(it => {
        if (it !== item) { it.classList.remove('open'); it.querySelector('.faq-a').style.maxHeight = '0px'; }
      });
      if (isOpen) { item.classList.remove('open'); ans.style.maxHeight = '0px'; }
      else { item.classList.add('open'); ans.style.maxHeight = ans.scrollHeight + 'px'; }
    });
  });

  // Animate land-cost ranking bars on scroll into view
  (function(){
    const rows = document.querySelectorAll('#rankBars .rank-row');
    const maxVal = 1278; // highest land cost = full-width reference
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const paint = () => rows.forEach(r => {
      const fill = r.querySelector('.rank-fill');
      const pct = (parseFloat(r.dataset.val) / maxVal) * 100;
      fill.style.transform = 'scaleX(' + (pct/100) + ')';
    });
    if (reduce) { paint(); return; }
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries, obs) => {
        entries.forEach(e => { if (e.isIntersecting) { paint(); obs.disconnect(); } });
      }, { threshold: 0.25 });
      io.observe(document.getElementById('rankBars'));
    } else { paint(); }
  })();
</script>
