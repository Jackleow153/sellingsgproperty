name: Monthly URA resale refresh

# Refreshes the "Resale condos within 3 km" table on upcoming Condo Analysis files
# from URA caveat data, rebuilds the site and commits only if something changed.
# Needs the repository secret URA_ACCESS_KEY.

on:
  schedule:
    # 10:37 SGT on the 3rd of each month (02:37 UTC). Off-the-hour minute so GitHub does not drop it.
    - cron: "37 2 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-resale
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tailwind for the build
        run: npm install --no-audit --no-fund

      - name: Pull URA resales and update the 3 km tables
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
        run: node scripts/ura-resale.cjs

      - name: Rebuild pages
        run: node scripts/build-pages.cjs

      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data assets condo-analysis
          git commit -m "Monthly URA resale refresh for upcoming condo files"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
