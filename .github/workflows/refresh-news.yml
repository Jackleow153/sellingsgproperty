name: Publish property news

on:
  schedule:
    # Every 30 minutes from 06:00 to 23:30 Asia/Singapore (UTC+8, no daylight saving).
    # 06:00 SGT is 22:00 UTC. 23:30 SGT is 15:30 UTC.
    - cron: "*/30 0-15,22-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-property-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull new stories and publish
        run: python3 scripts/refresh-news.py --deploy
