name: Publish property news

on:
  schedule:
    # Once a day at 09:30 Asia/Singapore (UTC+8, no daylight saving).
    # 09:30 SGT is 01:30 UTC.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-property-news
  cancel-in-progress: false

jobs:
  publish:
    # macos-latest is required for the local masthead reader (Apple Vision).
    # The script does not call a language model.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull new stories and publish
        run: python3 scripts/refresh-news.py --deploy
