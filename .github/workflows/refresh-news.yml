name: Publish property news

on:
  schedule:
    # GitHub delays or drops a cron that lands on a busy minute, and a missed
    # run does not catch up. These two times are Asia/Singapore (UTC+8).
    # 09:17 SGT is 01:17 UTC. 17:47 SGT is 09:47 UTC.
    # The evening run is only a backup. An unchanged news list does not commit.
    - cron: "17 1 * * *"
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-property-news
  cancel-in-progress: false

jobs:
  publish:
    # macos-latest is required for the local masthead reader (Apple Vision).
    # The script does not call a language model.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull new stories and publish
        run: python3 scripts/refresh-news.py --deploy
