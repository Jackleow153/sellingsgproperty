name: Publish property news

on:
  schedule:
    # Once a day at 09:17 SGT (01:17 UTC), on an off-peak minute so GitHub does not drop it.
    # One run a day means at most one news deploy a day (saves Netlify credits).
    # An unchanged news list does not commit. Run it by hand from the Actions tab if a day is missed.
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-property-news
  cancel-in-progress: false

jobs:
  publish:
    # macos-latest is required for the local masthead reader (Apple Vision).
    # A new story whose article page opens is sent to grok-4.7 for original
    # key points. Set repository secret XAI_API_KEY or the headline draft stays.
    # An unchanged list does not commit.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull new stories and publish
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python3 scripts/refresh-news.py --deploy
